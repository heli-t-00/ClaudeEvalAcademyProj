name: Selenium Cucumber Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  test:
    name: Run 44 Cucumber Scenarios
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: sbt

      # ── 3. Set up sbt ───────────────────────────────────────────────────────
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # ── 4. Install Chrome ───────────────────────────────────────────────────
      # ubuntu-latest ships with Chrome; this step ensures it is up to date
      - name: Install latest Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] https://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # ── 5. Run tests ─────────────────────────────────────────────────────────
      # CI=true is set automatically by GitHub Actions — Hooks.scala detects this
      # and enables headless Chrome with --no-sandbox / --disable-dev-shm-usage
      - name: Run Cucumber test suite
        run: sbt test
        env:
          CI: true

      # ── 6. Upload reports (always — even on failure) ─────────────────────────
      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/report.html
          retention-days: 30

      - name: Upload Cucumber JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-report
          path: target/cucumber-reports/report.json
          retention-days: 30

      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-report
          path: target/cucumber-reports/report.xml
          retention-days: 30

      # ── 7. Publish JUnit results in GitHub UI ────────────────────────────────
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/cucumber-reports/report.xml
          check_name: Cucumber Test Results
          include_passed: true
          detailed_summary: true
